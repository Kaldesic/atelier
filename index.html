<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0f1115">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self';">

<body>
    <div class="container">
        <nav class="nav-back" id="nav-back" style="display: none;">

            <p class="subtitle">A curated digital workshop for minimalist web tools and utilities.</p>

            </div>

                <input type="text" id="tool-search" class="search-input" placeholder="Search tools (e.g., 'image', 'svg', 'converter')...">
            </div>
        </header>

        <main id="app-root">

    <script src="js/core.js"></script>
