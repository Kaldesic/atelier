<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Ensure paths resolve correctly on GitHub Pages (/atelier/) and Localhost (/)
        const path = window.location.pathname;
        const baseHref = path.includes('/atelier') ? '/atelier/' : '/';
        document.write('<base href="' + baseHref + '">');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier — Minimalist Web Utilities</title>
    
    <meta name="description" content="A curated digital workshop for minimalist web tools and utilities.">
    <meta name="theme-color" content="#0f1115">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self';">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    
    <script>
        // Initialize theme before DOM renders to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('atelier-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="stylesheet" href="css/main.css?v=14">
</head>
<body>
    <div class="container">
        <nav class="nav-back nav-bar" id="nav-back" style="display: none;">
            <a href="#" data-link>← Back to Atelier</a>
            <button class="theme-toggle-btn" id="theme-toggle-tool" title="Toggle Dark/Light Mode" aria-label="Toggle theme"></button>
        </nav>
        
        <header id="home-header">
            <div class="header-top">
                <div>
                    <h1>Atelier</h1>
                    <p class="subtitle">A curated digital workshop for minimalist web tools and utilities.</p>
                </div>
                <button class="theme-toggle-btn" id="theme-toggle-home" title="Toggle Dark/Light Mode" aria-label="Toggle theme"></button>
            </div>

            <div class="privacy-badge">
                <span class="privacy-dot"></span>
                100% Private & Client-Side Execution • Zero Telemetry
            </div>
        
            <div class="search-container">
                <div class="search-wrapper">
                    <input type="text" id="tool-search" class="search-input" placeholder="Search tools (press '/' or 'Ctrl+K')...">
                    <span class="search-kbd">/</span>
                </div>
            </div>
        </header>

        <main id="app-root">
            <!-- Dynamic routing injects content here -->
        </main>
    </div>

    <footer>
        <p>100% Client-side processing • No analytics • Processing strictly in RAM</p>
        <p>Built with precision for web developers & designers.</p>
    </footer>

    <script src="js/core.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
